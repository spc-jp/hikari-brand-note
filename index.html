                        <div className="text-left">
                            <h1 className="text-2xl font-bold text-hikari-text leading-tight">HIKARI Brand Note</h1>
                            <p className="text-sm text-gray-500">承認された画像と表現で、迷わず1分投稿。</p>
                        </div>
                    </header>

                    <div className="mb-4">
                        <button onClick={()=>setOpenGuide(!openGuide)}
                            className="w-full flex items-center justify-between bg-white rounded-xl border border-gray-200 shadow-sm px-4 py-3 hover:bg-gray-50">
                            <span className="font-bold text-hikari-text">📱 SNSの使い方（どこに何を出す？）</span>
                            <span className="text-gray-400">{openGuide ? '▲' : '▼'}</span>
                        </button>
                        {openGuide &&
                            <div className="mt-2 space-y-2 fade">
                                <p className="text-sm text-hikari-text bg-hikari-base rounded-lg px-3 py-2">
                                    見せる（Insta）／信頼を積む（FB）／広げる・届ける（X）。<br/>
                                    この三役で回すのが、公式SNS運用のコツです。
                                </p>
                                {CHANNELS.map(c => (
                                    <div key={c.name} className="bg-white rounded-xl border border-gray-200 p-4 border-l-4" style={{ borderLeftColor: c.color }}>
                                        <div className="flex items-center gap-2 mb-1.5">
                                            <span className="font-bold text-hikari-text">{c.name}</span>
                                            <span className="text-xs text-white px-2 py-0.5 rounded-full" style={{ background: c.color }}>{c.role}</span>
                                        </div>
                                        <p className="text-sm text-gray-700 mb-1"><span className="text-gray-400">読者：</span>{c.who}</p>
                                        <p className="text-sm text-gray-700 mb-2">{c.use}</p>
                                        <div className="text-xs text-gray-500">
                                            <span className="font-bold text-hikari-text">こんな投稿が向いています</span>
                                            <ul className="list-disc list-inside mt-1 space-y-0.5">
                                                {c.ex.map((e,i) => <li key={i}>{e}</li>)}
                                            </ul>
                                        </div>
                                    </div>
                                ))}
                            </div>}
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-5 space-y-5">
                        <div>
                            <Label n="1">いつの投稿？</Label>
                            <select className={sel} value={when} onChange={e=>setWhen(e.target.value)}>
                                {WHENS.map(w => <option key={w.v} value={w.v}>{w.label}</option>)}
                            </select>
                        </div>

                        <div>
                            <Label n="2">だれに伝える？</Label>
                            <select className={sel} value={audience} onChange={e=>setAudience(e.target.value)}>
                                {AUDIENCES.map(a => <option key={a.v} value={a.v}>{a.label}</option>)}
                            </select>
                        </div>

                        <div>
                            <Label n="3">なにを伝える？</Label>
                            <select className={sel + " mb-2"} value={tmpl} onChange={e=>onTmpl(e.target.value)}>
                                {TEMPLATES.map((t,i) => <option key={i} value={t.value}>{t.label}</option>)}
                            </select>
                            <textarea className={sel + " h-32 resize-none"} value={message}
                                onChange={e=>setMessage(e.target.value)}
                                placeholder="例：今日は工場見学がありました。（1行でもOK）" />
                            {ngHits.length > 0 &&
                                <div className="mt-2 text-sm bg-red-50 border border-red-200 text-red-700 rounded-lg p-3">
                                    ⚠️ 表現に注意：「{ngHits.join('」「')}」が含まれています。<br/>
                                    <span className="text-xs">薬機法・景表法の観点から、言い切り表現は避けるのがおすすめです。</span>
                                </div>}
                        </div>

                        <div>
                            <Label n="4">どんな目的で？</Label>
                            <select className={sel} value={purpose} onChange={e=>setPurpose(e.target.value)}>
                                {Object.keys(PURPOSES).map(k => <option key={k} value={k}>{PURPOSES[k].label}</option>)}
                            </select>
                            <p className="text-xs text-gray-400 mt-1">※目的にあわせて、締めの言葉と案内が自動で変わります。</p>
                        </div>

                        <div className="pt-1 border-t border-gray-100">
                            <div className="flex items-center gap-2 mb-1.5 mt-3">
                                <span className="font-bold text-hikari-text">投稿に添える画像</span>
                                <span className="text-[11px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full">社内サーバー登録画像のみ</span>
                            </div>
                            <select className={sel} value={imageId} onChange={e=>setImageId(e.target.value)}>
                                <option value="">画像なし</option>
                                {groups.map(g => (
                                    <optgroup key={g} label={g}>
                                        {REGISTERED_IMAGES.filter(i=>i.group===g).map(i =>
                                            <option key={i.id} value={i.id}>{i.name}</option>)}
                                    </optgroup>
                                ))}
                            </select>
                            {selImg &&
                                <div className="mt-2 flex items-center gap-3 bg-hikari-base rounded-lg p-2 fade">
                                    <img src={selImg.url} alt="" className="w-20 h-14 object-cover rounded border border-gray-200" />
                                    <div className="text-sm text-hikari-text">
                                        <div className="font-bold">{selImg.name}</div>
                                        <div className="text-xs text-gray-500">{selImg.group}／社内サーバー登録画像</div>
                                    </div>
                                </div>}
                            <p className="text-[11px] text-gray-400 mt-1.5">
                                ※外部URLの貼り付け・端末からのアップロードはできません。承認済み画像だけを掲載できます。
                            </p>
                        </div>

                        <button onClick={build}
                            className="w-full py-3.5 rounded-xl bg-hikari-accent text-white font-bold text-lg shadow-sm hover:opacity-90">
                            投稿文をつくる
                        </button>
                    </div>

                    <div className="mt-5 space-y-3">
                        <OutputCard title="投稿文（Instagram／Facebook 兼用）" text={out.main} ck="main"
                            note={selImg &&
                                <div className="text-sm bg-hikari-base rounded-lg px-3 py-2 text-hikari-text">
                                    📎 添える画像：<span className="font-bold">{selImg.name}</span>（社内サーバー登録画像）
                                </div>} />

                        {!showX
                            ? <button onClick={()=>setShowX(true)}
                                className="w-full py-2.5 rounded-lg border border-gray-300 bg-white text-hikari-text text-sm font-bold hover:bg-gray-50">
                                X（旧Twitter）用の短い版も表示する</button>
                            : <OutputCard title="X（旧Twitter）用・短縮版" text={out.x} ck="x" />}
                    </div>

                    <div className="mt-5">
                        <button onClick={()=>setOpenSetting(!openSetting)}
                            className="text-sm text-gray-500 underline">
                            {openSetting ? '▲ はじめの設定を閉じる' : '▼ はじめの設定（署名・リンク・1回だけ）'}
                        </button>
                        {openSetting &&
                            <div className="mt-2 bg-white rounded-xl border border-gray-200 p-4 space-y-4 fade">
                                <label className="flex items-center gap-2 text-sm font-bold text-hikari-text">
                                    <input type="checkbox" checked={useSig} onChange={e=>setUseSig(e.target.checked)} />
                                    署名（フッター）を入れる
                                </label>
                                <textarea className={sel + " h-20 resize-none text-sm"} value={signature}
                                    onChange={e=>setSignature(e.target.value)} />
                                <div>
                                    <label className="text-sm font-bold text-hikari-text block mb-1">リンクの案内文</label>
                                    <input className={sel + " text-sm"} value={linkText}
                                        onChange={e=>setLinkText(e.target.value)} />
                                </div>
                            </div>}
                    </div>

                    <p className="text-center text-[11px] text-gray-400 mt-8">HIKARI Brand Note ／ 考えるを、ひとりにしない。</p>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
